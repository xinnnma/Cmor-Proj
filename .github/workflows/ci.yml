name: MLForge tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked development environment
        run: uv sync --locked --dev --python 3.12

      - name: Check package import
        run: uv run --locked python -c "from mlforge import LinearRegression, LogisticRegression; print('Import OK')"

      - name: Run all tests
        run: uv run --locked pytest -q
