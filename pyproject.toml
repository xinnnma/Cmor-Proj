[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mlforge"
version = "0.1.0"
description = "A machine learning package built from scratch for a CMOR 438 / INDE 577 group project at Rice University."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "ipykernel>=6",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.0.6",
    "pytest>=8",
    "scikit-learn>=1.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
